name: syncraft
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: syncraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-syncraft-demo}
      POSTGRES_DB: syncraft
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U syncraft]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      SYNCRAFT_DEMO: "true"
      DATABASE_URL: postgres://syncraft:${POSTGRES_PASSWORD:-local-syncraft-demo}@postgres:5432/syncraft?sslmode=disable
      ALLOWED_ORIGINS: http://127.0.0.1:5176,http://localhost:5176
    ports: ["127.0.0.1:8091:8091"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:5176:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
